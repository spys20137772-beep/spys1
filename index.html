      line([[0,-.42],[0,.42]],'#2563eb',.07); break;
    case 'berserker':
      poly([[-.58,-.38],[-.92,-.86],[-.28,-.66]],'#f8fafc');
      poly([[.58,-.38],[.92,-.86],[.28,-.66]],'#f8fafc');
      poly([[-.62,-.1],[-.25,-.35],[0,-.12],[.25,-.35],[.62,-.1],[.4,.42],[0,.62],[-.4,.42]],'#7f1d1d');
      eye(-.25,.08);eye(.25,.08);line([[-.22,.38],[0,.24],[.22,.38]],'#fff',.07);break;
    case 'vampire':
      poly([[-.78,-.55],[0,-.9],[.78,-.55],[.48,-.1],[0,.18],[-.48,-.1]],'#1e1b4b');
      eye(-.28,-.05);eye(.28,-.05);
      poly([[-.35,.28],[-.18,.66],[0,.42],[.18,.66],[.35,.28],[0,.52]],'#f8fafc');
      line([[-.38,.2],[0,.32],[.38,.2]],'#991b1b',.06);break;
    case 'gravity':
      ring(.35,'#f8fafc',.07);ring(.62,'#a78bfa',.055);
      g.save();g.rotate(.75);g.beginPath();g.ellipse(0,0,.95,.34,0,0,Math.PI*2);g.strokeStyle='#c4b5fd';g.lineWidth=.07;g.stroke();g.restore();
      g.fillStyle='#111827';g.beginPath();g.arc(0,0,.18,0,Math.PI*2);g.fill();
      poly([[-.62,-.5],[-.48,-.65],[-.35,-.5],[-.48,-.35]],'#fff');break;
    case 'assassin':
      poly([[-.8,-.35],[-.65,-.85],[0,-.62],[.65,-.85],[.8,-.35],[.55,.58],[0,.78],[-.55,.58]],'#111827');
      eye(-.27,-.02);eye(.27,-.02);line([[-.5,-.2],[0,-.32],[.5,-.2]],'#ef4444',.07);break;
    case 'mine':
      ring(.62,'#111827',.15);
      for(let i=0;i<8;i++){g.save();g.rotate(i*Math.PI/4);poly([[-.12,-.83],[.12,-.83],[.09,-.58],[-.09,-.58]],'#facc15','#111827');g.restore()}
      poly([[-.4,-.35],[.4,-.35],[.4,.35],[-.4,.35]],'#facc15','#111827');
      line([[-.2,-.18],[.2,.18]],'#111827',.13);line([[-.2,.18],[.2,-.18]],'#111827',.13);break;
    case 'snake':
      g.beginPath();g.moveTo(-.72,.35);g.bezierCurveTo(-.55,-.8,.5,-.75,.62,.1);g.bezierCurveTo(.72,.72,-.2,.78,-.25,.28);
      g.strokeStyle='#14532d';g.lineWidth=.32;g.stroke();g.strokeStyle='#86efac';g.lineWidth=.12;g.stroke();
      eye(-.18,-.1);eye(.18,-.1);line([[-.12,.22],[0,.32],[.12,.22]],'#fef08a',.055);break;
    case 'clone':
      g.beginPath();g.moveTo(0,-.78);g.lineTo(0,.78);g.strokeStyle='#fff';g.lineWidth=.06;g.stroke();
      poly([[-.62,-.42],[-.1,-.58],[-.08,.48],[-.5,.58]],'#dbeafe');
      poly([[.62,-.42],[.1,-.58],[.08,.48],[.5,.58]],'#7c3aed');
      eye(-.3,-.08);eye(.3,-.08);break;
    case 'phoenix':
      for(let i=-2;i<=2;i++){g.save();g.rotate(i*.3);poly([[-.16,.58],[0,-.9],[.16,.58],[0,.35]],i%2?'#f97316':'#facc15','#7c2d12');g.restore()}
      ring(.25,'#fff7ed',.045);break;
    case 'ninja':
      poly([[-.82,-.25],[-.55,-.55],[.55,-.55],[.82,-.25],[.6,.5],[-.6,.5]],'#111827');
      line([[-.78,-.12],[.78,-.12]],'#dc2626',.14);eye(-.25,.08);eye(.25,.08);
      poly([[-.18,.48],[0,.72],[.18,.48]],'#e5e7eb');break;
    case 'bomb':
      ring(.65,'#111827',.12);poly([[-.5,-.4],[.5,-.4],[.62,.25],[0,.68],[-.62,.25]],'#374151');
      line([[.05,-.5],[.35,-.85],[.55,-.78]],'#facc15',.12);
      for(let i=0;i<5;i++){g.save();g.rotate(i*1.256);poly([[-.08,-.2],[0,-.42],[.08,-.2]],'#f97316');g.restore()}break;
    case 'lightning':
      poly([[-.1,-.85],[.48,-.18],[.12,-.12],[.3,.72],[-.48,-.12],[-.12,-.18]],'#fef08a','#1d4ed8');
      ring(.7,'#60a5fa',.045);break;
    case 'ice':
      for(let i=0;i<6;i++){g.save();g.rotate(i*Math.PI/3);poly([[-.12,-.82],[0,-1],[.12,-.82],[.08,.15],[-.08,.15]],'#e0f2fe','#38bdf8');g.restore()}
      ring(.32,'#fff',.05);break;
    case 'snow':
      for(let i=0;i<6;i++){g.save();g.rotate(i*Math.PI/3);line([[0,-.72],[0,.72]],'#fff',.075);line([[0,-.48],[-.18,-.3]],'#fff',.055);line([[0,-.48],[.18,-.3]],'#fff',.055);g.restore()}break;
    case 'dice':
      g.save();g.rotate(-.18);g.fillStyle='#f8fafc';g.strokeStyle='#7f1d1d';g.lineWidth=.1;g.beginPath();if(g.roundRect)g.roundRect(-.57,-.57,1.14,1.14,.18);else g.rect(-.57,-.57,1.14,1.14);g.fill();g.stroke();g.restore();
      g.fillStyle='#dc2626';[[-.3,-.3],[.3,-.3],[0,0],[-.3,.3],[.3,.3]].forEach(p=>{g.beginPath();g.arc(p[0],p[1],.09,0,Math.PI*2);g.fill()});break;
    case 'parasite':
      for(let i=0;i<8;i++){g.save();g.rotate(i*Math.PI/4);g.beginPath();g.moveTo(0,.5);g.quadraticCurveTo(.5,.25,.05,-.98);g.strokeStyle='#166534';g.lineWidth=.16;g.stroke();g.restore()}
      g.fillStyle='#a3e635';g.beginPath();g.ellipse(0,0,.43,.53,0,0,Math.PI*2);g.fill();eye(-.16,-.08);eye(.16,-.08);break;
    case 'curse':
      ring(.68,'#7e22ce',.1);ring(.42,'#c084fc',.045);
      poly([[0,-.7],[.18,-.2],[.65,-.15],[.28,.15],[.4,.62],[0,.35],[-.4,.62],[-.28,.15],[-.65,-.15],[-.18,-.2]],'#581c87','#e9d5ff');
      g.fillStyle='#fff';g.beginPath();g.arc(0,0,.1,0,Math.PI*2);g.fill();break;
    case 'mirror':
      poly([[0,-.82],[.58,-.35],[.45,.55],[0,.82],[-.45,.55],[-.58,-.35]],'#dbeafe','#64748b');
      poly([[-.25,-.48],[.12,-.55],[-.08,.12],[-.38,.35]],'#fff','#93c5fd');
      line([[.18,-.25],[.42,-.05],[.1,.42]],'#60a5fa',.06);break;
    case 'doppel':
      poly([[-.62,-.55],[0,-.78],[.62,-.55],[.5,.48],[0,.78],[-.5,.48]],'#64748b');
      line([[0,-.6],[0,.62]],'#e2e8f0',.06);eye(-.25,-.08);eye(.25,-.08);
      line([[-.28,.35],[0,.42],[.28,.35]],'#111827',.07);break;
    default:
      ring(.62,'#fff',.06);
      const seed=[...name].reduce((a,c)=>a+c.charCodeAt(0),0);
      for(let i=0;i<5;i++){g.save();g.rotate((seed%17)*.1+i*Math.PI*2/5);poly([[-.12,-.18],[0,-.7],[.12,-.18]],'#f8fafc');g.restore()}
      eye(-.22,.12);eye(.22,.12);
  }
  g.restore();
  if(b.ab.img){
    const im=getImg(b.ab.img);
    if(im.complete&&im.naturalWidth){
      g.save();g.beginPath();g.arc(0,0,.79,0,Math.PI*2);g.clip();
      g.drawImage(im,-.79,-.79,1.58,1.58);g.restore();
    }
  }
  g.lineWidth=.075;g.strokeStyle=flash?'#fff':'rgba(10,16,28,.8)';
  g.beginPath();g.arc(0,0,.83,0,Math.PI*2);g.stroke();
  g.restore();
  if(txt!=null){
    g.font='bold 20px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';
    g.lineWidth=4;g.strokeStyle='#fff';g.strokeText(txt,b.x,b.y);
    g.fillStyle='#111';g.fillText(txt,b.x,b.y);
  }
}
function icon(a,i,cf){
  const c=document.createElement('canvas');c.width=180;c.height=128;
  const g=c.getContext('2d'),b={x:55,y:64,r:32,ang:-.3,ab:typeof a==='object'?a:AB[a],wn:cf&&cf.wn>=1?cf.wn:1,wc:cf&&cf.wc,ws:cf&&cf.ws>=30?cf.ws:100,col:BC[i%BC.length]};
  const paint=()=>{g.clearRect(0,0,180,128);drawBall(b,g,null);if(cf&&cf.deco)drawDeco(g,b.x,b.y,b.r,cf.deco)};
  paint();
  if(b.ab.img){const im=getImg(b.ab.img);if(!im.complete)im.addEventListener('load',paint)}
  return c;
}

/* ---------- screens ---------- */
function summary(c){return `공격력 ${c.atk} · `+(AB[c.a].every?`연사 ${c.rate}/초 · `:'')+`속도 ${c.spd}`}
function renderSetup(){
  const box=$('cards');box.innerHTML='';
  cfg.forEach((c,i)=>{
    const d=document.createElement('div');d.className='card';
    const top=document.createElement('div');top.className='top';
    top.appendChild(icon(c.a,c.team,c));
    const t=document.createElement('div');t.innerHTML=`<b>공 ${i+1} · ${AB[c.a].n} <span style="color:${BC[c.team%BC.length]}">● 팀 ${c.team+1}</span></b><small>${summary(c)}</small>`;
    top.appendChild(t);d.appendChild(top);
    const r=document.createElement('div');r.className='cardbtns';   /* 버튼 한 줄 (아이콘 + 짧은 이름) */
    const b1=document.createElement('button');b1.textContent='공 선택';b1.onclick=()=>{cur=i;renderPick();show('pick')};
    const b2=document.createElement('button');b2.className='ghost';b2.textContent='설정';b2.onclick=()=>{cur=i;renderOpt();show('opt')};
    const b4=document.createElement('button');b4.className='ghost';b4.textContent='팀 설정';b4.onclick=()=>{cur=i;renderTeam();show('tm')};
    const b5=document.createElement('button');b5.className='ghost';b5.textContent='꾸미기';b5.onclick=()=>{cur=i;openDeco()};
    const b6=document.createElement('button');b6.className='ghost';b6.textContent='훈련장';b6.onclick=()=>startTraining(c.a);
    r.append(b1,b2,b6,b5,b4);
    if(cfg.length>2){const b3=document.createElement('button');b3.className='ghost';b3.textContent='삭제';b3.onclick=()=>{cfg.splice(i,1);renderSetup()};r.append(b3)}
    [['🔄','공 선택'],['⚙️','설정'],['🎯','훈련'],['🎩','꾸미기'],['👥','팀'],['🗑','삭제']].forEach(([e,t],j)=>{const x=r.children[j];if(x)x.innerHTML=`<i>${e}</i>${t}`});
    d.appendChild(r);
    const f=document.createElement('div');f.className='field';
    f.innerHTML='<span>기본 HP</span>';
    const inp=document.createElement('input');inp.type='number';inp.min=1;inp.max=1000000;inp.value=c.hp;inp.inputMode='numeric';
    inp.oninput=()=>{c.hp=parseFloat(inp.value)};
    inp.onchange=()=>{c.hp=Math.round(cl(inp.value,1,1000000,100));inp.value=c.hp};
    f.appendChild(inp);d.appendChild(f);
    const pf=document.createElement('div');pf.className='field';
    const used=cfg.filter(x=>x.pad).length,slot=cfg.slice(0,i).filter(x=>x.pad).length+1;
    pf.innerHTML=`<span>🎮 직접 조종 (조이스틱)${c.pad?' · P'+slot:''}</span>`;
    const pc=document.createElement('input');pc.type='checkbox';pc.checked=!!c.pad;pc.disabled=!c.pad&&used>=4;
    pc.onchange=()=>{c.pad=pc.checked;renderSetup()};
    pf.appendChild(pc);d.appendChild(pf);box.appendChild(d);
  });
  const hint=document.createElement('small');hint.style.opacity='.7';hint.textContent='직접 조종은 최대 4개 · 조이스틱은 방향만 바꿀 수 있고 속도는 그대로예요';box.appendChild(hint);
  const add=document.createElement('button');add.className='ghost';add.style.width='100%';
  add.textContent=`+ 공 추가 (${cfg.length}/${MAX})`;add.disabled=cfg.length>=MAX;
  add.onclick=()=>{const k=cfg.length%AB.length;cfg.push(Object.assign({hp:AB[k].hp??100,team:newTeam()},defs(k)));renderSetup()};
  box.appendChild(add);
  {const rb=document.createElement('button');rb.className='ghost';rb.style.width='100%';rb.textContent='🎲 무작위 공 추가';rb.disabled=cfg.length>=MAX;   /* 무작위 공 */
   rb.onclick=()=>{const pool=AB.map((a,i)=>a.trainingOnly?-1:i).filter(i=>i>=0),k=pool[Math.floor(Math.random()*pool.length)];cfg.push(Object.assign({hp:AB[k].hp??100,team:newTeam()},defs(k)));renderSetup()};box.appendChild(rb)}
  const ok=new Set(cfg.map(c=>c.team)).size>=2;$('start').disabled=!ok;
  if(!ok){const h=document.createElement('small');h.style.opacity='.7';h.textContent='서로 다른 팀이 2개 이상 필요해요';box.appendChild(h)}
}
const PICK_VIEWS=['자세히','격자','간단히'];
function renderPick(){
  $('pickT').textContent=`공 ${cur+1} 선택`;
  const v=Math.min(2,Math.max(0,Math.round(SET.pickView)||0));
  const pv=$('pickView');pv.innerHTML='';
  PICK_VIEWS.forEach((n,i)=>{const b=document.createElement('button');b.textContent=n;if(i!==v)b.className='ghost';
    b.onclick=()=>{SET.pickView=i;saveSet();renderPick()};pv.appendChild(b)});
  /* 검색칸 + 정렬 방식 */
  const pc=$('pickCtl');pc.innerHTML='';
  const q=document.createElement('input');q.type='search';q.placeholder='🔍 이름이나 설명으로 검색';q.value=pickQ;
  q.oninput=()=>{pickQ=q.value;renderPickList()};
  const so=document.createElement('select');
  PICK_SORTS.forEach(([k,t])=>{const o=document.createElement('option');o.value=k;o.textContent=t;if((SET.pickSort||'def')===k)o.selected=true;so.appendChild(o)});
  so.onchange=()=>{SET.pickSort=so.value;saveSet();renderPickList()};
  const rv=document.createElement('button');rv.textContent='↕ 반전';rv.className=SET.pickRev?'':'ghost';rv.style.cssText='flex:none;padding:8px 12px';
  rv.onclick=()=>{SET.pickRev=!SET.pickRev;saveSet();rv.className=SET.pickRev?'':'ghost';renderPickList()};
  pc.append(q,so,rv);
  if(SET.pickSort==='fav'){SET.pickSort='def';SET.pickFav=true}   /* 예전 '즐겨찾기 먼저' 정렬은 체크박스로 옮김 */
  const fc=$('pickFav');fc.checked=!!SET.pickFav;fc.onchange=()=>{SET.pickFav=fc.checked;saveSet();renderPickList()};
  renderPickList();
}

let lastDailyPair=null;
function getDailyRound(reroll){
  const pool=AB.map((a,i)=>a.trainingOnly?-1:i).filter(i=>i>=0);
  const date=new Date(),stamp=[date.getFullYear(),String(date.getMonth()+1).padStart(2,'0'),String(date.getDate()).padStart(2,'0')].join('-');
  const pairs=[];
  for(let i=0;i<pool.length;i++)for(let j=i+1;j<pool.length;j++){
    const a=pool[i],b=pool[j];
    pairs.push({a,b,key:`${Math.min(a,b)}:${Math.max(a,b)}`});
  }
  /* 처음엔 날짜로 정해진 대진(그날은 항상 같음), '다른 대진'을 누르면 무작위 */
  let h=0;for(const ch of stamp)h=(h*31+ch.charCodeAt(0))>>>0;
  const options=pairs.filter(p=>p.key!==lastDailyPair);
  const pick=(reroll?options[Math.floor(Math.random()*options.length)]:pairs[h%pairs.length])||pairs[0];
  if(!pick)return{stamp,a:pool[0],b:pool[1]};
  lastDailyPair=pick.key;
  const flip=reroll?Math.random()<.5:(h>>8)%2===1;
  return{stamp,a:flip?pick.b:pick.a,b:flip?pick.a:pick.b};
}

  if(rg){d.every=cl(sp.every,.01,50,.7);d.ps=cl(sp.ps,50,10000,300);d.proj=PROJ_LIST.some(x=>x[0]===sp.proj)?sp.proj:'arrow'}

[쓸 수 있는 것]
- balls: 모든 공 배열. 공 속성 x,y,vx,vy,r,hp,max,atk,spd,team,o(설정값), 적인지 확인은 q.team!==me.team && q.hp>0
- dmg(공격자,맞는공,넉백,방향x,방향y,배율) : 피해 = 공격자.atk × 배율 (방어·치명타 등 자동 적용)
- hurtDirect(맞는공,피해,공격자) : 고정 피해 (독·장판 같은 지속 피해)
- shots.push({x,y,vx,vy,o:me,p:{kb:넉백,draw(g,h){...h.x,h.y에 그리기}},life:초,m:피해배율}) : 투사체 직접 쏘기
- fx.push({x,y,t:.3,r:반지름}) : 폭발 고리 효과 (t는 반드시 .3)
- texts.push({x,y,t:'글자',life:.8}) : 떠오르는 글자
- W, H : 경기장 가로·세로 (보통 360×480), snd('shot'|'hit'|'boom') : 효과음
- 공마다 상태를 저장하려면 me.내이름 = 값 (예: me.cnt=(me.cnt||0)+1)

[규칙]
- 원·타원 반지름은 절대 음수가 되면 안 됨 (Math.max(0,값) 사용)
- onHit·onHurt 안에서 dmg를 또 부를 때는 무한 반복되지 않게 플래그로 막기 (예시 참고)
- 인터넷·파일·localStorage·document·window 사용 금지, 다른 전역 변수를 덮어쓰지 말 것
- 밸런스: hp는 100 근처, 평범한 공 atk 8~12. 1대1에서 다른 공들과 비슷하게 이길 정도로
- 능력 숫자는 opts로 빼서 설정창에서 바꿀 수 있게. label은 한국어
- 재밌고 새로운 능력 + 무기 모양을 draw로 직접 그려 주면 좋음

        w.append(i,b);f.appendChild(w);
      }else{
        const i=document.createElement('input');i.type='number';i.min=lo;i.max=hi;i.step=st;i.value=SET[k];

/* 소리: 파일 없이 브라우저에서 직접 합성 (WebAudio) */
let AUD=null;
function ac(){try{if(!AUD){const C=window.AudioContext||window.webkitAudioContext;if(C)AUD=new C()}if(AUD&&AUD.state==='suspended')AUD.resume()}catch(e){}return AUD}
function tone(f0,f1,dur,type,vol,delay=0){
  const c=ac();if(!c||!(vol>0))return;
  try{const t=c.currentTime+delay,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+.02)}catch(e){}
}
function noise(dur,vol,cut,ft){
  const c=ac();if(!c||!(vol>0))return;
  try{const n=Math.floor(c.sampleRate*dur),b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
    const s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain(),t=c.currentTime;
    s.buffer=b;f.type=ft||'lowpass';f.frequency.value=cut;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    s.connect(f);f.connect(g);g.connect(c.destination);s.start(t)}catch(e){}
}
const SND_FLAG={hit:'sHit',crit:'sHit',shot:'sShot',boom:'sBoom',die:'sDie',ev:'sEvent',win:'sEvent',cd:'sEvent',go:'sEvent'};
const sLast={};
/* 공마다 다른 소리: 무기 종류로 음색을 정하고, 이름으로 음높이를 조금씩 다르게 (같은 종류라도 공마다 다른 소리) */
const VCAT={sword:'blade',twin:'blade',doppel:'blade',fang:'blade',pin:'blade',shuriken:'blade',
  axe:'heavy',flail:'heavy',wrench:'heavy',claw:'heavy',bossspike:'heavy',bomb:'heavy',
  spear:'pierce',rifle:'pierce',laser:'pierce',
  shield:'clang',magnet:'clang',scale:'clang',clock:'clang',
  mage:'magic',healstaff:'magic',orb:'magic',grav:'magic',feather:'magic',
  minigun:'gun',bow:'string',boomerang:'whirl',card:'paper',guitar:'pluck',brush:'soft',flipper:'soft',none:'soft',mine:'soft',turret:'gun'};
let sndB=null;
function voiceOf(A){if(!A)return{c:'soft',f:220};if(A._v)return A._v;let h=0;for(const ch of String(A.n||''))h=(h*31+ch.charCodeAt(0))>>>0;
  const c=VCAT[A.weapon]||(A.every?'string':'soft'),f=Math.round(220*(.72+(h%60)/100));   /* 160~350Hz: 높지 않은 음역 */
  return A._v={c,f}}
function snd(k,b){
  if(!SET.snd||SET[SND_FLAG[k]]===false)return;
  const c=ac();if(!c)return;
  b=b||sndB;const V=voiceOf(b&&b.ab),F=V.f,kk=k+(b&&b.ab?b.ab.n:'');
  const now=c.currentTime;if(sLast[kk]&&now-sLast[kk]<.05)return;sLast[kk]=now;
  const v=SET.vol/100*.5,r=Math.random(),j=1+(r-.5)*.08;
  if(k==='hit'||k==='crit'){const cr=k==='crit',L=cr?1.25:1;   /* 맞힐 때: 무기 종류별 음색 */
    switch(V.c){
      case 'blade':tone(F*2*j,F*1.1,.07,'triangle',v*.5*L);noise(.05,v*.45*L,3200,'highpass');break;   /* 챙 */
      case 'heavy':tone(F*.8*j,F*.35,.13,'sawtooth',v*.55*L);noise(.09,v*.6*L,600);tone(F*.4,F*.25,.12,'sine',v*.8*L);break;   /* 쿵 */
      case 'pierce':noise(.05,v*.6*L,1800,'bandpass');tone(F*1.5*j,F*1.2,.05,'square',v*.25*L);break;   /* 퓩 */
      case 'clang':tone(F*1.5*j,F*1.45,.2,'square',v*.22*L);tone(F*2.27*j,F*2.2,.16,'triangle',v*.3*L);break;   /* 땡 */
      case 'magic':tone(F*1.1*j,F*2,.12,'sine',v*.55*L);noise(.08,v*.25*L,900);break;   /* 뿅 */
      case 'gun':tone(F*2.4*j,F*.9,.03,'square',v*.3*L);noise(.03,v*.4*L,2600,'highpass');break;   /* 탁 */
      case 'string':tone(F*1.3*j,F*.9,.07,'triangle',v*.45*L);noise(.04,v*.3*L,1500);break;
      case 'whirl':tone(F*.9*j,F*.6,.1,'sawtooth',v*.3*L);noise(.06,v*.35*L,1000);break;
      case 'paper':noise(.04,v*.5*L,4000,'highpass');tone(F*1.8*j,F*1.6,.03,'triangle',v*.2*L);break;   /* 착 */
      case 'pluck':{const sc=[1,1.122,1.26,1.5,1.68],n=sc[Math.floor(r*5)];tone(F*n,F*n,.22,'triangle',v*.45*L);tone(F*n*2,F*n*2,.12,'sine',v*.2*L)}break;   /* 띵 (음계) */
      default:tone(F*.75*j,F*.35,.09,'sine',v*.8*L);noise(.06,v*.5*L,900)}   /* 퍽 */
    if(cr)tone(F*3,F*2.2,.12,'triangle',v*.35,.02)}   /* 치명타는 반짝 소리 추가 */
  else if(k==='shot'){   /* 쏠 때 */
    switch(V.c){
      case 'gun':tone(F*2*j,F*.7,.035,'square',v*.25);noise(.03,v*.35,2200,'highpass');break;
      case 'magic':noise(.12,v*.3,1200);tone(F*.8*j,F*1.5,.12,'sine',v*.35);break;   /* 휘융 */
      case 'pierce':tone(F*3*j,F*.8,.06,'sawtooth',v*.22);break;
      case 'paper':noise(.05,v*.4,3500,'highpass');break;
      case 'whirl':tone(F*j,F*.7,.12,'sawtooth',v*.2);break;
      case 'pluck':{const sc=[1,1.26,1.5,2],n=sc[Math.floor(r*4)];tone(F*n,F*n,.15,'triangle',v*.35)}break;
      default:tone(F*1.4*j,F*.7,.08,'triangle',v*.45)}}   /* 팅 (예전보다 낮게) */
  else if(k==='die')tone(F*1.3,F*.25,.4,'sawtooth',v*.6);
  else if(k==='boom'){noise(.3,v*1.1,700);tone(130,40,.28,'sine',v*1.2)}
  else if(k==='ev'){tone(520,520,.12,'square',v*.5);tone(780,780,.18,'square',v*.5,.12)}
  else if(k==='win')[523,659,784,1046].forEach((f,i)=>tone(f,f,.18,'square',v*.6,i*.13));
  else if(k==='cd')tone(587,587,.14,'square',v*.6);   /* 카운트다운 3·2·1 */
  else if(k==='go'){tone(880,880,.1,'square',v*.7);tone(1175,1175,.28,'square',v*.7,.08)}   /* GO! */
}

let bgmT=null,bgmN=0;

function bgmStart(){
  bgmStop();if(!SET.snd||!SET.bgm||$('game').hidden||!ac())return;
  const tick=()=>{if($('game').hidden||!SET.bgm||!SET.snd){bgmStop();return}
    const T=TRACKS[bgmTrack()],v=SET.bgmVol/100*.22,i=bgmN%16,n=T.mel[i],beat=60/T.bpm;   /* 상황에 맞는 곡 (8분음표 하나씩) */
    if(n>=0)tone(T.sc[n%T.sc.length],0,beat*.45,T.w,v*(T.w==='sawtooth'||T.w==='square'?.4:1));
    if(i%4===0)tone(T.bass[(i/4|0)%T.bass.length],0,beat*.9,'sine',v*1.5);
    if(T.dr){if(i%4===0)tone(90,40,.12,'sine',v*1.6);if(i%4===2)noise(.06,v*.6,3000,'highpass');if(T.dr===2&&i%2===1)noise(.03,v*.35,6000,'highpass')}

}

let evT=0,evItems=[],meteors=[],evBanner=null,frenzyT=0,evWind=null;

function fireEvent(){
  const L=[];
  if(SET.evMeteor)L.push('meteor');if(SET.evHeal)L.push('heal');if(SET.evPower)L.push('power');
  if(SET.evFrenzy)L.push('frenzy');if(SET.evWind)L.push('wind');
  if(!L.length)return;
  const k=L[Math.floor(Math.random()*L.length)],R=(a,b)=>a+Math.random()*(b-a);
  if(k==='meteor'){for(let i=0;i<4;i++){const t=1.3+i*.3;meteors.push({x:R(40,W-40),y:R(40,H-40),r:48,t,t0:t})}evBanner={s:'운석 낙하!',tm:2}}
  else if(k==='heal'){evItems.push({x:R(30,W-30),y:R(30,H-30),k:'heal',t:10});evBanner={s:'회복 팩 등장!',tm:2}}
  else if(k==='power'){evItems.push({x:R(30,W-30),y:R(30,H-30),k:'power',t:10});evBanner={s:'파워업 오브 등장! (6초간 공격력 x1.5)',tm:2}}
  else if(k==='frenzy'){frenzyT=5;evBanner={s:'광란! 모두 빨라진다',tm:2}}
  else{const a=R(0,6.283);evWind={ax:Math.cos(a)*450,ay:Math.sin(a)*450,t:4};
    evBanner={s:'강풍! '+['→','↘','↓','↙','←','↖','↑','↗'][Math.round(a/(Math.PI/4))%8]+' 방향',tm:2}}

}
function runEvents(dt){
  if(frenzyT>0)frenzyT-=dt;
  if(evWind){evWind.t-=dt;if(evWind.t<=0)evWind=null}
  if(evBanner){evBanner.tm-=dt;if(evBanner.tm<=0)evBanner=null}
  for(const m of meteors){
    m.t-=dt;
    if(m.t<=0){m.d=1;fx.push({x:m.x,y:m.y,t:.3,r:m.r+10});
      for(const b of balls)if(b.hp>0&&Math.hypot(b.x-m.x,b.y-m.y)<m.r+b.r){
        const d=Math.max(1,Math.round(SET.evDmg));b.flash=.15;hurtDirect(b,d,null)}}
  }
  meteors=meteors.filter(m=>!m.d);
  for(const it of evItems){
    it.t-=dt;
    for(const b of balls){
      if(b.hp<=0||Math.hypot(b.x-it.x,b.y-it.y)>=b.r+12)continue;
      it.t=0;
      if(it.k==='heal'){b.hp=Math.min(b.max,b.hp+Math.round(b.base*SET.evHealP/100));say2(b,'회복!')}
      else{b.pwT=6;say2(b,'파워업!')}
      snd('ev');break;
    }
  }
  evItems=evItems.filter(i=>i.t>0);
  if(!SET.ev)return;
  evT-=dt;
  if(evT<=0){evT=Math.max(.5,cl(SET.evEvery,1,500,4));if(Math.random()*100<cl(SET.evChance,1,100,50))fireEvent()}
}
/* 캔버스 내부 해상도를 '화면에 실제로 보이는 크기 x 기기 배율'에 맞춤 (경기장 크기와 무관하게 선명) */
/* 경기장 겉크기: 남은 공간(가로·세로) 안에서 경기장 비율을 지키며 가장 크게 */
function sizeArena(){
  const wrap=cv.parentElement;if(!wrap||$('game').hidden)return;
  let ww=wrap.clientWidth-12,wh=wrap.clientHeight-12;if(ww<=0||wh<=0)return;
  if(balls.some(b=>b.ctl!=null)&&window.innerWidth<720)wh-=64;   /* 좁은 화면에서 조이스틱을 쓰면 아래쪽을 조금 비움 */
  const w=Math.max(80,Math.min(ww,wh*W/H));
  cv.style.width=Math.floor(w)+'px';cv.style.height=Math.floor(w*H/W)+'px';
}
function fitCanvas(){
  sizeArena();
  const cw=cv.clientWidth;if(!cw)return;
  const k=Math.min(4,Math.max(.02,cw*(window.devicePixelRatio||1)/W));   /* 경기장을 아주 크게 해도 캔버스 픽셀은 화면 크기만큼만 (폰이 안 터지게) */
  cv.width=Math.round(W*k);cv.height=Math.round(H*k);ctx.setTransform(k,0,0,k,0,0);
}
window.addEventListener('resize',()=>{if(!$('game').hidden){fitCanvas();layoutPads()}});
if(window.visualViewport)visualViewport.addEventListener('resize',()=>{if(!$('game').hidden){fitCanvas();layoutPads()}});

}

  if(d.k==='scorch'){const gr=g.createRadialGradient(d.x,d.y,0,d.x,d.y,d.r);gr.addColorStop(0,'rgba(20,12,8,.55)');gr.addColorStop(.6,'rgba(30,18,10,.25)');gr.addColorStop(1,'rgba(30,18,10,0)');g.fillStyle=gr;g.beginPath();g.arc(d.x,d.y,d.r,0,6.283);g.fill()}
  else if(d.k==='crack'){g.strokeStyle='rgba(20,20,30,.45)';g.lineWidth=2;g.beginPath();for(const [an,l] of d.pts){g.moveTo(d.x,d.y);const mx=d.x+Math.cos(an+.2)*d.r*l*.5,my=d.y+Math.sin(an+.2)*d.r*l*.5;g.lineTo(mx,my);g.lineTo(d.x+Math.cos(an)*d.r*l,d.y+Math.sin(an)*d.r*l)}g.stroke()}
  else if(d.k==='splat'){g.fillStyle=hexA(d.col,.4);g.beginPath();g.arc(d.x,d.y,d.r*.6,0,6.283);g.fill();for(const [an,l] of d.pts){g.beginPath();g.arc(d.x+Math.cos(an)*d.r*l*.8,d.y+Math.sin(an)*d.r*l*.8,d.r*.22*l,0,6.283);g.fill()}}
  else if(d.k==='frost'){g.fillStyle='rgba(208,235,255,.35)';g.beginPath();g.arc(d.x,d.y,d.r,0,6.283);g.fill();g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=1.2;g.beginPath();for(let i=0;i<6;i++){const an=i*1.047;g.moveTo(d.x,d.y);g.lineTo(d.x+Math.cos(an)*d.r*.8,d.y+Math.sin(an)*d.r*.8)}g.stroke()}
  else{g.globalCompositeOperation=FXL;glowAt(g,d.x,d.y,d.r,d.col||'#ffffff',a*.35);g.globalCompositeOperation='source-over'}}
  g.globalAlpha=1}

function drawBallFx(b){
  if(!fxOn())return;const T=themeOf(b),g=ctx;if(FXLV<1)return;
  if(FXLV>=2){g.globalCompositeOperation=FXL;glowAt(g,b.x,b.y+b.r*.15,b.r*1.85,T.c[0],(b.owner?.09:.2)*(FXL==='lighter'?1:.7));g.globalCompositeOperation='source-over';g.globalAlpha=1}
  const v=Math.hypot(b.vx,b.vy);if(v>Math.max(260,(b.spd||170)*1.7)&&!b.owner){g.fillStyle=b.col;for(let i=1;i<=3;i++){g.globalAlpha=.12/i;g.beginPath();g.arc(b.x-b.vx*.018*i,b.y-b.vy*.018*i,b.r*(1-i*.08),0,6.283);g.fill()}g.globalAlpha=1}   /* 잔상 */
  if(T.tip&&!b.ab.every&&Math.random()<.22){const A=b.ab,s=(b.ws||100)/100,L=b.r+(rch(b)||20)*s,an=b.ang;   /* 무기 끝에서 나오는 입자 */
    const x=b.x+Math.cos(an)*L,y=b.y+Math.sin(an)*L,tp=T.tip;
    if(tp==='ember')FP({k:'dot',x,y,vx:Rn(-15,15),vy:Rn(-60,-20),dr:1.5,r:Rn(1.2,2.4),life:Rn(.3,.6),col:RI(T.c),add:1});
    else if(tp==='frost')FP({k:'flake',x,y,vx:Rn(-20,20),vy:Rn(-10,30),dr:1,rot:Rn(0,6),vr:Rn(-3,3),r:Rn(2,3.5),life:.6,col:T.c[0],add:1});
    else if(tp==='shadow')FP({k:'wisp',x,y,vx:Rn(-10,10),vy:Rn(-40,-15),dr:1,r:Rn(2.5,4),grow:-3,life:.6,col:RI([T.c[2],'#212529'])});
    else if(tp==='toxic')FP({k:'bubble',x,y,vx:Rn(-10,10),vy:Rn(-40,-15),dr:1,r:Rn(1.5,3),life:.6,col:T.c[0]});
    else if(tp==='blood')FP({k:'drop',x,y,vx:Rn(-10,10),vy:0,g:300,dr:1,r:1.6,life:.5,col:'#e03131'})}

function drawShotFx(h){
  if(!fxOn()||!h.o)return;const T=themeOf(h.o),g=ctx;
  if(!h._s){h._s=1;const sp=Math.hypot(h.vx,h.vy)||1,ux=h.vx/sp,uy=h.vy/sp;   /* 발사 불꽃 + 반동 */
    FP({k:'glow',x:h.x,y:h.y,r:13,life:.1,col:T.c[0],add:1,a:.85});fxSparks(h.x,h.y,Math.atan2(uy,ux),.7,3,200,T.c,{life:Rn(.1,.2)});h.o.rec=.09}
  const tr=h.tr||(h.tr=[]);tr.push(h.x,h.y);if(tr.length>14)tr.splice(0,2);
  const st=T.tr;if(tr.length>=4&&FXLV>=1){g.globalCompositeOperation=FXL;g.lineCap='round';
    for(let i=2;i<tr.length;i+=2){const f=i/tr.length;g.globalAlpha=f*(st==='streak'?.45:.6);g.strokeStyle=st==='ember'?T.c[i%3===0?1:0]:T.c[0];g.lineWidth=(st==='streak'?2:4)*f*(h.sz||1);
      g.beginPath();g.moveTo(tr[i-2],tr[i-1]);g.lineTo(tr[i],tr[i+1]);g.stroke()}
    g.globalCompositeOperation='source-over';g.globalAlpha=1}
  if(st==='ember'&&Math.random()<.5)FP({k:'dot',x:h.x+Rn(-3,3),y:h.y+Rn(-3,3),vx:Rn(-20,20),vy:Rn(-40,0),dr:2,r:Rn(1.2,2.2),life:Rn(.25,.45),col:RI(T.c),add:1});
  else if(st==='magic'&&Math.random()<.35)FP({k:'star',x:h.x,y:h.y,vx:Rn(-15,15),vy:Rn(-15,15),dr:2,rot:0,vr:5,r:Rn(2.5,4),life:.35,col:RI(T.c),add:1});
  else if(st==='spark'&&Math.random()<.3)FP({k:'bolt',x:h.x,y:h.y,pts:bolt(h.x,h.y,h.x+Rn(-14,14),h.y+Rn(-14,14),3),life:.08,col:T.c[0],add:1});
}
function drawFxRing(f){   /* 능력 폭발(fx): 빛 번짐 + 고리 + 처음 한 번 불씨 */
  const p=Math.max(0,f.t/.3),r=(f.r||50)*(1-p)+8;
  if(fxOn()){ctx.globalCompositeOperation=FXL;glowAt(ctx,f.x,f.y,r*1.25,'#ff922b',p*.55);ctx.globalCompositeOperation='source-over';
    if(!f._s){f._s=1;if((f.r||50)>=40)fxBurst(f.x,f.y,Math.min(18,Math.round((f.r||50)/6)),(f.r||50)*3,()=>({k:'dot',g:-60,dr:2.5,r:Rn(1.5,3),life:Rn(.35,.7),col:RI(['#ff922b','#ffd43b','#ffffff']),add:1}))}}
  ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,140,0,'+Math.min(1,f.t*3)+')';ctx.lineWidth=5;ctx.beginPath();ctx.arc(f.x,f.y,Math.max(0,r),0,6.3);ctx.stroke();
  ctx.strokeStyle='rgba(255,236,170,'+Math.min(1,f.t*2.5)+')';ctx.lineWidth=2;ctx.beginPath();ctx.arc(f.x,f.y,Math.max(0,r*.8),0,6.3);ctx.stroke();

/* 무기 궤적: 회전하는 근접 무기 뒤로 테마 색 잔상 (때리는 순간 더 밝게) */
function weaponTrail(g,b,T){
  const sw=Math.min(1.5,Math.abs(b.spin||0)*.12)+(b.wHit>0?.55:0);if(sw<.12||FXLV<1)return;
  const inner=b.r*.95,outer=b.r+(rch(b)||20),d=(b.dir||1)>0?1:-1,hit=b.wHit>0?1.6:1;
  g.save();g.globalCompositeOperation=FXL;
  for(let i=0;i<3;i++){const a0=-d*sw*(1-i/3),a1=-d*sw*(1-(i+1)/3);g.fillStyle=hexA(T.c[0],(.05+i*.06)*hit);g.beginPath();g.arc(0,0,outer,a0,a1,d<0);g.arc(0,0,inner,a1,a0,d>0);g.closePath();g.fill()}
  g.strokeStyle=hexA(T.c[1],.35*hit);g.lineWidth=2;g.beginPath();g.arc(0,0,outer,-d*sw*.45,0,d<0);g.stroke();
  g.restore();
}
/* ---------- 타격감: 잠깐 멈춤 · 화면 흔들림 · 불꽃 파편 · 충격 고리 · 움찔 ---------- */
let parts=[],impacts=[],hitStop=0,shakeA=0,hsCool=0,winT=0;
const reduceMotion=!!(window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches);
function shake(v){if(SET.fxShake===false||reduceMotion)return;shakeA=Math.min(10,Math.max(shakeA,v))}
function spark(x,y,an,spread,n,spd,cols){for(let i=0;i<n&&parts.length<320;i++){const a=an+(Math.random()-.5)*spread,v=spd*(.4+Math.random()*.8),l=.25+Math.random()*.3;
  parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:l,max:l,col:cols[i%cols.length],r:1.5+Math.random()*2.5})}}
function hitFx(a,b,d,crit){
  if(SET.fx===false)return;
  const dx=b.x-a.x,dy=b.y-a.y,l=Math.hypot(dx,dy)||1,px=b.x-dx/l*b.r*.85,py=b.y-dy/l*b.r*.85,an=Math.atan2(dy,dx);
  const T=themeOf(a),k=Math.min(2.2,1+d*.045)*(crit?1.4:1)*[.5,.8,1][FXLV];
  (FXH[T.hit]||FXH.whack)(a,b,px,py,an,k,T);   /* 때린 공의 테마로 타격 효과 */
  if(crit){FP({k:'glow',x:px,y:py,r:b.r*1.6,life:.22,col:'#ffd43b',add:1,a:.7});fxBurst(px,py,8,320,()=>({k:'star',dr:3,rot:0,vr:6,r:Rn(4,7),life:.4,col:RI(['#ffd43b','#ffffff',T.c[0]]),add:1}))}
  impacts.push({x:px,y:py,t:crit?.26:.18,t0:crit?.26:.18,r:Math.max(10,b.r*.7),crit,rot:Math.random(),col:T.c[0]});
  a.wHit=.16;if(T.thrust)a.thr=.12;   /* 공격 모션: 무기가 번쩍 · 창은 찌르기 */
  b.pop=Math.max(b.pop||0,crit?.2:.12);
  if(!(hsCool>0)){hitStop=Math.max(hitStop,crit?.075:Math.min(.05,.018+d*.003));hsCool=.22}   /* 연타가 빨라도 0.22초에 한 번만 멈춤 */
  shake(crit?5.5:Math.min(4,1+d*.18));
}
function killFx(b){
  if(SET.fx===false)return;
  {const T=themeOf(b);(FXD[T.die]||FXD.dissolve)(b,T,b.owner?.5:1);   /* 쓰러진 공의 테마로 사망 효과 */
   impacts.push({x:b.x,y:b.y,t:.35,t0:.35,r:b.r*1.2,crit:false,rot:0,col:T.c[0]})}
  if(!b.owner){hitStop=Math.max(hitStop,.16);shake(8)}
}
/* ---------- 승리 화면: 이긴 공을 크게, 뒤에서 빛줄기가 천천히 회전 ---------- */
function hideWin(){winT=0;const w=$('winBox');if(w)w.hidden=true}
function showWin(){
  if(!over||$('game').hidden)return;
  const alive=balls.filter(b=>b.hp>0&&!b.owner),t=alive.length?alive[0].team:null,col=t==null?'#868e96':BC[t%BC.length];
  const box=$('winBox'),ic=$('winIcons');ic.innerHTML='';
  const shown=t==null?[]:balls.filter(b=>b.team===t&&!b.owner&&b.ci!=null);
  for(const b of shown.slice(0,4)){const c=cfg[b.ci];if(!c)continue;const cv2=icon(c.a,c.team,c);if(b.hp<=0)cv2.style.filter='grayscale(1) opacity(.5)';ic.appendChild(cv2)}
  ic.className='winicons'+(shown.length>1?' many':'');
  const solo=t!=null&&cfg.filter(c=>c.team===t).length===1;
  $('winTitle').textContent=t==null?'무승부':'승리!';
  $('winSub').textContent=t==null?'모두 쓰러졌어요':solo?(alive[0].ab.n||''):'팀 '+(t+1);
  const hp=alive.reduce((s,b)=>s+Math.max(0,Math.round(b.hp)),0);
  $('winStat').textContent=`경기 시간 ${Math.floor(battleT/60)}:${String(Math.floor(battleT%60)).padStart(2,'0')}`+(t==null?'':` · 남은 HP ${hp}`);
  box.style.setProperty('--wc',modeWin()||col);{const wb=balls.find(b=>b.hp>0&&!b.owner);box.style.setProperty('--wc2',wb?themeOf(wb).c[0]:col)}   /* 빛줄기는 이긴 공의 색 */renderWinTbl();$('winTbl').hidden=true;$('winStatsBtn').textContent='📊 경기 통계';$('winMenu').textContent=modeK?'모드 선택':'설정으로';
  if(modeK==='surv'&&survPl){ic.innerHTML='';const cv3=icon(survPl.ab===AB[cfg[0].a]?cfg[0].a:0,0,cfg[0]);cv3.style.filter='grayscale(1) opacity(.6)';ic.appendChild(cv3);ic.className='winicons'}
  box.hidden=false;
}
/* ---------- 화상 표시: 빨간 불꽃이 타오름 ---------- */
function drawBurn(b){
  const t=performance.now()/1000,g=ctx,r=b.r;g.save();
  g.globalAlpha=.35;const gl=g.createRadialGradient(b.x,b.y,r*.5,b.x,b.y,r*1.5);gl.addColorStop(0,'rgba(255,90,20,.9)');gl.addColorStop(1,'rgba(255,90,20,0)');
  g.fillStyle=gl;g.beginPath();g.arc(b.x,b.y,r*1.5,0,6.283);g.fill();g.globalAlpha=1;
  for(let i=0;i<7;i++){const a=-1.57+(i-3)*.42,fl=.55+.45*Math.abs(Math.sin(t*9+i*1.7)),h=r*(.55+.5*fl)*(i===3?1.3:1-Math.abs(i-3)*.12);
    const bx=b.x+Math.cos(a)*r*.82,by=b.y+Math.sin(a)*r*.82,tx=bx+Math.cos(a)*h+Math.sin(t*7+i)*r*.12,ty=by+Math.sin(a)*h-r*.15;
    const w=r*.28;g.beginPath();g.moveTo(bx-Math.sin(a)*w,by+Math.cos(a)*w);g.quadraticCurveTo(bx+Math.cos(a)*h*.5-Math.sin(a)*w*1.1,by+Math.sin(a)*h*.5+Math.cos(a)*w*1.1,tx,ty);
    g.quadraticCurveTo(bx+Math.cos(a)*h*.5+Math.sin(a)*w*1.1,by+Math.sin(a)*h*.5-Math.cos(a)*w*1.1,bx+Math.sin(a)*w,by-Math.cos(a)*w);g.closePath();
    const fg=g.createLinearGradient(bx,by,tx,ty);fg.addColorStop(0,'#ff3b1f');fg.addColorStop(.55,'#ff922b');fg.addColorStop(1,'rgba(255,230,120,.2)');g.fillStyle=fg;g.fill()}
  g.restore();
}
/* ---------- 독 표시: 초록으로 물들고 독 기포 ---------- */
function drawTox(b){
  const t=performance.now()/1000,g=ctx,r=b.r;g.save();
  g.globalAlpha=.42;g.fillStyle='#69db3c';g.beginPath();g.arc(b.x,b.y,r*.84,0,6.283);g.fill();   /* 초록으로 물듦 */
  g.globalAlpha=.7;g.strokeStyle='#2f9e44';g.lineWidth=3;g.setLineDash([5,5]);g.lineDashOffset=-t*20;g.beginPath();g.arc(b.x,b.y,r+4,0,6.283);g.stroke();g.setLineDash([]);
  for(let i=0;i<4;i++){const f=(t*.8+i/4)%1,x=b.x+Math.sin(i*2.4+t)*r*.7,y=b.y-r*.3-f*r*1.4;
    g.globalAlpha=.85*(1-f);g.fillStyle=i%2?'#94d82d':'#40c057';g.strokeStyle='#1b5e20';g.lineWidth=1.2;g.beginPath();g.arc(x,y,2+3*(1-f)+i%2,0,6.283);g.fill();g.stroke()}
  g.globalAlpha=.8;g.fillStyle='#51cf66';const dy=(t*1.5)%1;g.beginPath();g.ellipse(b.x+r*.35,b.y+r*.75+dy*r*.5,2.5,4,0,0,6.283);g.fill();   /* 뚝뚝 */
  g.restore();
}
/* ---------- 경기 시작 카운트다운: 3 · 2 · 1 동안 공이 멈춰 있고, GO!와 함께 출발 ---------- */
const CD_LEN=3.7,CD_GO=.7;   /* 숫자 1초씩 3번 + GO! 0.7초 */
let cdT=0,cdLast=null;
function cdLabel(){return cdT>CD_GO?String(Math.ceil(cdT-CD_GO)):'GO!'}
function drawCountdown(){
  const lab=cdLabel(),go=lab==='GO!',f=go?1-cdT/CD_GO:1-((cdT-CD_GO)%1||1);   /* f: 이 글자가 나온 뒤 지난 비율 0→1 */
  const col={'3':'#e8453c','2':'#f2c94c','1':'#4dabf7','GO!':'#51cf66'}[lab]||'#fff';
  if(!go){ctx.fillStyle='rgba(10,8,30,.35)';ctx.fillRect(0,0,W,H)}
  const sz=Math.min(W,H)*(go?.3:.42)*(1.35-.35*Math.min(1,f*4));   /* 크게 튀어나왔다가 제자리 */
  ctx.save();ctx.globalAlpha=go?Math.max(0,1-f*1.1):Math.min(1,.3+f*4)*(f>.85?(1-f)/.15:1);
  ctx.translate(W/2,H/2);ctx.rotate(go?0:-.06);
  ctx.font=`bold ${Math.round(sz)}px "Black Han Sans","Noto Sans KR",system-ui,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.lineJoin='round';ctx.lineWidth=sz*.12;ctx.strokeStyle='#1a1240';ctx.strokeText(lab,0,sz*.06);
  ctx.fillStyle='#1a1240';ctx.fillText(lab,0,sz*.06);
  ctx.lineWidth=sz*.06;ctx.strokeStyle='#fff';ctx.strokeText(lab,0,0);ctx.fillStyle=col;ctx.fillText(lab,0,0);   /* 흰 테두리 스티커 */
  ctx.globalAlpha*=.45;ctx.fillStyle='#fff';ctx.save();ctx.beginPath();ctx.rect(-W,-sz*.5,2*W,sz*.32);ctx.clip();ctx.fillText(lab,0,0);ctx.restore();   /* 위쪽 광택 */
  ctx.restore();
}
/* ---------- 경기 중 공을 누르면 정보 말풍선 (설정에서 끌 수 있음) ---------- */
let infoB=null,infoT=0;
function ballAt(x,y){let best=null,bd=1e9;for(const b of balls){if(b.hp<=0)continue;const d=Math.hypot(b.x-x,b.y-y);if(d<b.r+12&&d<bd){bd=d;best=b}}return best}
cv.addEventListener('pointerdown',e=>{if(SET.ballInfo===false||$('game').hidden)return;const r=cv.getBoundingClientRect();if(!r.width)return;
  const b=ballAt((e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H);if(b&&b!==infoB){infoB=b;infoT=4}else{infoB=null;infoT=0}});
function wrapTxt(g,t,w){const out=[];let line='';for(const ch of String(t)){if(g.measureText(line+ch).width>w&&line){out.push(line);line=ch}else line+=ch}if(line)out.push(line);return out.slice(0,3)}
function drawInfo(){
  const b=infoB;if(!b||!(infoT>0)||SET.ballInfo===false)return;if(b.hp<=0&&!over){infoB=null;return}
  const g=ctx,A=b.ab,T=themeOf(b);g.save();g.font='bold 12px system-ui,sans-serif';g.textAlign='left';g.textBaseline='top';
  const L=[[`${A.n}${b.owner?' (소환)':''}`,'#ffffff',13],[`HP ${Math.max(0,Math.ceil(b.hp))} / ${Math.round(b.max)} · 공격력 ${+(+b.atk).toFixed(1)}`,'#ffe066',12]];
  if(A.d)for(const l of wrapTxt(g,A.d,170))L.push([l,'#dee2e6',11]);
  L.push([`준 피해 ${Math.round(b.sD||0)} · 받은 피해 ${Math.round(b.sT||0)} · 처치 ${b.sK||0}`,'#a5d8ff',11]);
  const w=Math.min(W-12,190),h=L.reduce((s,l)=>s+l[2]+4,10),x=Math.max(6,Math.min(W-w-6,b.x-w/2));let y=b.y-b.r-h-12;if(y<6)y=b.y+b.r+12;y=Math.min(H-h-6,y);
  g.globalAlpha=Math.min(1,infoT*3);g.fillStyle='rgba(18,14,44,.9)';g.strokeStyle=T.c[0];g.lineWidth=2;
  g.beginPath();if(g.roundRect)g.roundRect(x,y,w,h,10);else g.rect(x,y,w,h);g.fill();g.stroke();
  g.beginPath();g.moveTo(b.x,y>b.y?y:y+h);g.lineTo(b.x,y>b.y?b.y+b.r:b.y-b.r);g.stroke();
  let yy=y+6;for(const [t,c,sz] of L){g.font=`bold ${sz}px system-ui,sans-serif`;g.fillStyle=c;g.fillText(t,x+8,yy);yy+=sz+4}
  g.restore();
}

/* ---------- 배경음악: 일반 · 보스전 · 생존 · 훈련 · 승리 곡이 따로 (상황이 바뀌면 곡도 바뀜) ---------- */
const TRACKS={
  normal:{bpm:132,w:'triangle',sc:[262,294,330,392,440,523,587,659],mel:[0,2,4,2,5,4,2,-1,0,2,4,5,7,5,4,-1],bass:[131,131,165,147],dr:1},
  boss:{bpm:152,w:'sawtooth',sc:[220,247,262,294,330,349,392,440],mel:[0,-1,0,3,2,-1,1,0,0,-1,0,5,4,3,2,1],bass:[110,110,87,98],dr:2},
  surv:{bpm:140,w:'square',sc:[196,220,233,262,294,311,349,392],mel:[0,3,5,3,7,5,3,2,0,3,5,6,7,-1,6,5],bass:[98,98,117,87],dr:1},
  calm:{bpm:96,w:'sine',sc:[262,294,330,392,440,523],mel:[0,-1,2,-1,4,-1,2,-1,5,-1,4,-1,2,-1,-1,-1],bass:[131,175,165,147],dr:0},
  win:{bpm:120,w:'square',sc:[523,587,659,698,784,880,988,1047],mel:[0,2,4,7,-1,4,7,-1,5,4,2,4,7,-1,-1,-1],bass:[262,262,349,392],dr:1}
};
function bgmTrack(){return over?'win':modeK==='boss'?'boss':modeK==='surv'?'surv':trainingActive?'calm':'normal'}

/* ---------- 자동 효과 조절 (설정에서 켜기, 기본 꺼짐): 화면이 버벅이면 효과를 단계적으로 줄이고, 다시 부드러워지면 되돌림 ---------- */
let FXLV=2,fpsAcc=0,fpsN=0,fpsT=0;
function autoFxTick(real){
  if(!SET.autoFx){FXLV=2;return}if(!(real>0)||real>.5)return;fpsAcc+=real;fpsN++;fpsT+=real;if(fpsT<1.5)return;
  const avg=fpsAcc/fpsN;fpsAcc=fpsN=0;fpsT=0;if(avg>1/40&&FXLV>0)FXLV--;else if(avg<1/56&&FXLV<2)FXLV++;
}

/* ---------- 자동 백업: 하루에 한 번 이 폰 안에 저장 (최근 3개) ---------- */
function autoBak(){try{const d=new Date(),day=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  let L=LS.get('bb_autobak',[]);if(!Array.isArray(L))L=[];if(L[0]&&L[0].day===day)return;L.unshift({day,code:bakMake(),at:d.getTime()});L=L.slice(0,3);
  try{localStorage.setItem('bb_autobak',JSON.stringify(L))}catch(e){try{localStorage.setItem('bb_autobak',JSON.stringify(L.slice(0,1)))}catch(_){}}}catch(e){}}
setTimeout(autoBak,3000);

/* ---------- 처음 켰을 때 안내 (설정에서 다시 보기) ---------- */
const TUT=[['👋 환영해요!','공을 골라 경기장에 풀어 놓으면 알아서 싸워요. 마지막까지 남는 공이 이겨요.'],
  ['▶ 플레이','공 카드에서 🔄로 공을 고르고, ⚙️로 능력을 바꾸고, 🎩로 장식을 씌울 수 있어요. 🎯은 혼자 연습하는 훈련장이에요.'],
  ['👹 보스전 · 🛡 생존','조이스틱으로 직접 조종하는 모드예요. 보스를 쓰러뜨리거나 웨이브를 최대한 오래 버텨 보세요.'],
  ['🛠 커스텀 공 · 🤖 AI','직접 공을 만들거나, ChatGPT·Claude 같은 AI에게 부탁해서 새로운 능력을 가진 공을 만들 수 있어요.'],
  ['💾 저장 · 불러오기','만든 공과 기록을 코드로 저장해서 다른 폰이나 친구에게 옮겨요. 하루 한 번 자동 백업도 돼요. 이 안내는 설정에서 다시 볼 수 있어요.']];
function showTut(force){
  if(!force&&LS.get('bb_tut',0))return;if(document.querySelector&&document.querySelector('.tut'))return;let i=0;
  const ov=document.createElement('div');ov.className='tut';const card=document.createElement('div');card.className='tutcard';ov.appendChild(card);document.body.appendChild(ov);

setTimeout(()=>showTut(false),500);

/* ---------- 색약 모드: 팀마다 공 테두리 무늬 + 팀 번호 ---------- */
const CB_DASH=[[],[9,5],[2,4],[12,4,2,4],[1,7],[6,2],[3,3,9,3],[14,6]];
function drawTeamMark(b){
  const g=ctx,t=b.team||0;g.save();g.setLineDash(CB_DASH[t%8]);g.lineWidth=5;g.strokeStyle='#111';g.beginPath();g.arc(b.x,b.y,b.r+4,0,6.283);g.stroke();
  g.lineWidth=2.6;g.strokeStyle='#fff';g.stroke();g.setLineDash([]);
  const x=b.x+b.r*.72,y=b.y-b.r*.72;g.fillStyle='#111';g.beginPath();g.arc(x,y,8,0,6.283);g.fill();g.strokeStyle='#fff';g.lineWidth=1.5;g.stroke();
  g.fillStyle='#fff';g.font='bold 10px system-ui,sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText(String(t+1),x,y+.5);g.restore();
}
let last=performance.now();
function loop(n){
  const real=(n-last)/1000,raw=Math.min(.033,real),dt=raw*speed;last=n;
  if(!$('game').hidden){
    autoFxTick(real);if(infoT>0)infoT-=raw;   /* 자동 효과 조절 · 정보 말풍선 시간 */
    if(cdT>0){cdT=Math.max(0,cdT-raw);const lab=cdLabel();if(lab!==cdLast){cdLast=lab;snd(lab==='GO!'?'go':'cd')}}
    if(hitStop>0)hitStop=Math.max(0,hitStop-raw);   /* 타격 순간 잠깐 멈춤 */
    else if(!(cdT>CD_GO)&&!paused){const sub=Math.ceil(dt/.008)||1;for(let i=0;i<sub;i++)step(dt/sub)}
    if(finT>0){finT-=raw;fxTick(raw*.3)}   /* 결정타 슬로모 */
    else if(over&&!paused)celebTick(raw);   /* 승리 효과 */   /* 숫자 나오는 동안은 멈춤 */
    if(shakeA>0)shakeA=Math.max(0,shakeA-raw*38);
    if(hsCool>0)hsCool-=raw;
    if(winT>0){winT-=raw;if(winT<=0)showWin()}
    draw()}
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
